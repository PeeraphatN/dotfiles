# ===== Prefix key =====
# เปลี่ยนจาก Ctrl+b เป็น Ctrl+a (กดง่ายกว่า)
unbind C-b
set -g prefix C-a
# Keep Ctrl-A and also accept Ctrl-ฟ when the Thai layout sends it distinctly.
# In terminals that translate Ctrl-ฟ to Ctrl-A, the primary prefix already works.
set -g prefix2 C-ฟ
set -g extended-keys on
bind C-a send-prefix
bind C-ฟ send-prefix

# Thai-layout aliases for common Ctrl keys; forward the physical-key control
# sequence to the current pane without needing to switch input language.
bind-key -n C-บ send-keys Escape   # physical Ctrl-[
bind-key -n C-แ send-keys C-c      # physical Ctrl-C
bind-key -n C-ม send-keys C-,      # physical Ctrl-,
bind-key -n C-ก send-keys C-d      # physical Ctrl-D

# ===== Split panes ด้วย | และ - =====
# เห็นภาพชัดเจน: | = แบ่งซ้าย-ขวา, - = แบ่งบน-ล่าง
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ===== Reload config ด้วย prefix + r =====
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== ย้าย pane ด้วย Alt + arrow (ไม่ต้องกด prefix) =====
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ===== สลับ window ด้วย Shift + arrow =====
bind -n S-Left previous-window
bind -n S-Right next-window

# ===== เริ่มนับ window/pane จาก 1 (แทน 0) =====
set -g base-index 1
setw -g pane-base-index 1

# ===== Mouse support (scroll, click เลือก pane, resize) =====
set -g mouse on

# ===== เพิ่ม history scrollback =====
set -g history-limit 10000

# ===== ลด delay ตอนกด ESC (สำคัญสำหรับ vim) =====
set -sg escape-time 10

# ===== Clipboard: OSC 52 for local and SSH clients =====
# `external` lets tmux copy outward but blocks applications in panes from
# replacing the clipboard. Win Terminal, VS Code, and modern macOS terminals
# expose OSC 52 through their xterm-compatible terminal type.
set -s set-clipboard external
set -as terminal-features ',xterm*:clipboard'
# Preserve OSC 52 when tmux is nested inside another tmux instance.
set -g allow-passthrough on

# ===== Copy mode แบบ vim =====
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Do not use xclip/wl-copy here: remote SSH hosts have no local display.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ===== Plugins (TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'

# ===== Catppuccin options (ต้องอยู่ก่อน run catppuccin) =====
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# ===== โหลด catppuccin manually ก่อน (สำคัญ!) =====
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# ===== Status bar (ต้องอยู่หลัง run catppuccin) =====
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# ===== โหลด cpu หลัง catppuccin =====
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'

# ⚠️ TPM ต้องอยู่บรรทัดสุดท้ายเสมอ (จัดการ plugins อื่นๆ)
run '~/.tmux/plugins/tpm/tpm'
